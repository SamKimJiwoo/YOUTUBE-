<!DOCTYPE html>
<html lang="ko" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LTE2E | 모든 테크가 내 머리에 들어갈 때까지</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Noto+Sans+Arabic:wght@400;600&family=Noto+Sans+JP:wght@400;600&family=Noto+Sans+KR:wght@300;400;600;700&family=Noto+Sans+SC:wght@400;600&family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-primary: #06080d;
      --bg-secondary: #0e131f;
      --card-bg: rgba(16, 21, 33, 0.55);
      --card-border: rgba(255, 255, 255, 0.09);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent-gold: #f59e0b;
      --accent-gold-light: #fde68a;
      --accent-blue: #38bdf8;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: var(--bg-primary);
      color: var(--text-main);
      font-family: 'Plus Jakarta Sans', 'Noto Sans KR', 'Noto Sans JP', 'Noto Sans SC', 'Noto Sans Arabic', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
      position: relative;
      user-select: none;
    }

    /* 실시간 스파크 캔버스 */
    #sparkCanvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      pointer-events: none;
    }

    /* 클래식 건축 그리드 + 원근감 */
    .bg-grid {
      position: fixed;
      inset: 0;
      background-image: 
        linear-gradient(to right, rgba(245, 158, 11, 0.04) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(56, 189, 248, 0.04) 1px, transparent 1px);
      background-size: 56px 56px;
      z-index: 0;
      mask-image: radial-gradient(circle at 50% 45%, black 35%, transparent 88%);
      animation: gridPulse 8s ease-in-out infinite alternate;
    }

    @keyframes gridPulse {
      0% { opacity: 0.6; transform: scale(1); }
      100% { opacity: 1; transform: scale(1.03); }
    }

    /* 배경 오로라 오브 */
    .ambient-orb {
      position: fixed;
      border-radius: 50%;
      filter: blur(120px);
      z-index: 0;
      opacity: 0.45;
      animation: orbDrift 11s ease-in-out infinite alternate;
      pointer-events: none;
    }

    .orb-1 {
      width: 460px;
      height: 460px;
      background: radial-gradient(circle, #0284c7, transparent 70%);
      top: -120px;
      left: -100px;
    }

    .orb-2 {
      width: 420px;
      height: 420px;
      background: radial-gradient(circle, #d97706, transparent 70%);
      bottom: -100px;
      right: -80px;
      animation-delay: -4s;
    }

    @keyframes orbDrift {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(55px, 40px) scale(1.18); }
    }

    /* 네비게이션 헤더 */
    header {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 1120px;
      margin: 0 auto;
      padding: 28px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      animation: slamDown 0.7s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .brand-logo {
      font-family: 'Cinzel', serif;
      font-size: 1.7rem;
      font-weight: 800;
      letter-spacing: 0.16em;
      color: var(--text-main);
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 12px;
      transition: text-shadow 0.3s ease;
    }

    .brand-logo:hover {
      text-shadow: 0 0 18px rgba(245, 158, 11, 0.7);
    }

    .brand-badge {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 0.68rem;
      font-weight: 700;
      letter-spacing: 0.14em;
      padding: 4px 10px;
      border: 1px solid rgba(245, 158, 11, 0.55);
      background: rgba(245, 158, 11, 0.1);
      color: var(--accent-gold-light);
      border-radius: 4px;
      text-transform: uppercase;
      box-shadow: 0 0 12px rgba(245, 158, 11, 0.25);
    }

    /* 메인 히어로 섹션 */
    main {
      position: relative;
      z-index: 10;
      flex: 1;
      width: 100%;
      max-width: 1000px;
      margin: 0 auto;
      padding: 50px 24px 90px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .hero-eyebrow {
      font-size: 0.85rem;
      font-weight: 600;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: var(--accent-gold-light);
      margin-bottom: 18px;
      opacity: 0;
      text-shadow: 0 0 14px rgba(245, 158, 11, 0.5);
      animation: fadeUp 0.7s cubic-bezier(0.16, 1, 0.3, 1) 0.1s forwards;
    }

    /* 스파크 쉬머 타이틀 */
    .hero-title-wrap {
      position: relative;
      display: inline-block;
      margin-bottom: 22px;
      opacity: 0;
      animation: electricStrike 0.85s cubic-bezier(0.16, 1, 0.3, 1) 0.22s forwards;
    }

    .hero-title {
      font-family: 'Cinzel', 'Noto Sans KR', serif;
      font-size: clamp(3.2rem, 8.5vw, 5.6rem);
      font-weight: 800;
      letter-spacing: 0.1em;
      line-height: 1.1;
      background: linear-gradient(
        110deg,
        #ffffff 20%,
        #93c5fd 38%,
        #fde68a 50%,
        #ffffff 62%,
        #cbd5e1 85%
      );
      background-size: 220% auto;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: metalShimmer 4s linear infinite;
      filter: drop-shadow(0 0 28px rgba(56, 189, 248, 0.25));
    }

    @keyframes metalShimmer {
      0% { background-position: 200% center; }
      100% { background-position: -200% center; }
    }

    @keyframes electricStrike {
      0% { opacity: 0; transform: scale(1.18) translateY(15px); filter: brightness(2.5); }
      40% { opacity: 1; transform: scale(0.98) translateY(0); filter: brightness(1.6); }
      60% { transform: scale(1.01); }
      100% { opacity: 1; transform: scale(1); filter: brightness(1); }
    }

    .hero-slogan {
      font-size: clamp(1.08rem, 2.5vw, 1.38rem);
      color: var(--text-muted);
      font-weight: 400;
      max-width: 640px;
      line-height: 1.7;
      margin-bottom: 48px;
      opacity: 0;
      animation: fadeUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.38s forwards;
    }

    /* 클래식 스파크 디바이더 */
    .classic-divider {
      position: relative;
      width: 180px;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--accent-blue), var(--accent-gold), transparent);
      margin: 0 auto 54px;
      opacity: 0;
      animation: scaleIn 0.7s ease 0.48s forwards;
      box-shadow: 0 0 15px rgba(245, 158, 11, 0.6);
    }

    .classic-divider::after {
      content: '◆';
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: var(--accent-gold-light);
      font-size: 0.75rem;
      background: var(--bg-primary);
      padding: 0 8px;
      text-shadow: 0 0 10px var(--accent-gold);
    }

    /* 3D 틸트 & 스파크 카드 그리드 */
    .social-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 24px;
      width: 100%;
      perspective: 1000px;
      opacity: 0;
      animation: fadeUp 0.85s cubic-bezier(0.16, 1, 0.3, 1) 0.58s forwards;
    }

    @media (max-width: 768px) {
      .social-grid {
        grid-template-columns: 1fr;
      }
    }

    .social-card {
      position: relative;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 18px;
      padding: 36px 24px;
      text-decoration: none;
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      backdrop-filter: blur(14px);
      transform-style: preserve-3d;
      transition: transform 0.2s ease-out, border-color 0.3s ease, box-shadow 0.3s ease;
      overflow: hidden;
    }

    /* 마우스 추적 스파크 스포트라이트 */
    .social-card::before {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(
        350px circle at var(--mouse-x, 50%) var(--mouse-y, 50%),
        rgba(245, 158, 11, 0.18),
        rgba(56, 189, 248, 0.08) 40%,
        transparent 75%
      );
      opacity: 0;
      transition: opacity 0.3s ease;
      pointer-events: none;
    }

    .social-card:hover::before {
      opacity: 1;
    }

    .social-card:hover {
      border-color: rgba(245, 158, 11, 0.65);
      box-shadow: 0 24px 48px -12px rgba(0, 0, 0, 0.85), 
                  0 0 30px rgba(245, 158, 11, 0.22);
    }

    .icon-wrapper {
      width: 66px;
      height: 66px;
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      align-items: center;
      justify-content: center;
      transform: translateZ(24px);
      transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1), 
                  background 0.3s ease, 
                  box-shadow 0.3s ease;
    }

    .social-card:hover .icon-wrapper {
      transform: translateZ(34px) scale(1.15) rotate(-5deg);
    }

    .card-youtube:hover .icon-wrapper { 
      background: rgba(255, 0, 0, 0.18); 
      border-color: rgba(255, 68, 68, 0.6); 
      box-shadow: 0 0 22px rgba(255, 0, 0, 0.45);
    }
    .card-discord:hover .icon-wrapper { 
      background: rgba(88, 101, 242, 0.2); 
      border-color: rgba(114, 137, 218, 0.65); 
      box-shadow: 0 0 22px rgba(88, 101, 242, 0.45);
    }
    .card-mail:hover .icon-wrapper { 
      background: rgba(245, 158, 11, 0.2); 
      border-color: rgba(253, 230, 138, 0.65); 
      box-shadow: 0 0 22px rgba(245, 158, 11, 0.45);
    }

    .social-card svg {
      width: 30px;
      height: 30px;
    }

    .card-title {
      font-size: 1.2rem;
      font-weight: 700;
      letter-spacing: 0.03em;
      transform: translateZ(16px);
    }

    .card-desc {
      font-size: 0.9rem;
      color: var(--text-muted);
      line-height: 1.55;
      transform: translateZ(10px);
    }

    /* 둥둥 뜨는 다국어 플로팅 버튼 & 펄스 파동 */
    .lang-floating-container {
      position: fixed;
      bottom: 32px;
      right: 32px;
      z-index: 1000;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
    }

    .lang-menu {
      background: rgba(12, 16, 26, 0.94);
      border: 1px solid rgba(245, 158, 11, 0.45);
      backdrop-filter: blur(18px);
      border-radius: 16px;
      padding: 8px;
      margin-bottom: 16px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      min-width: 162px;
      box-shadow: 0 22px 48px rgba(0, 0, 0, 0.75), 0 0 20px rgba(245, 158, 11, 0.15);
      opacity: 0;
      transform: translateY(18px) scale(0.9);
      pointer-events: none;
      transition: all 0.32s cubic-bezier(0.34, 1.56, 0.64, 1);
      transform-origin: bottom right;
    }

    .lang-menu.active {
      opacity: 1;
      transform: translateY(0) scale(1);
      pointer-events: auto;
    }

    .lang-option {
      background: transparent;
      border: none;
      color: var(--text-main);
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 0.9rem;
      text-align: left;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: background 0.2s ease, transform 0.2s ease, color 0.2s ease;
      font-family: inherit;
    }

    .lang-option:hover {
      background: rgba(245, 158, 11, 0.14);
      transform: translateX(-3px);
    }

    .lang-option.selected {
      background: rgba(245, 158, 11, 0.22);
      color: var(--accent-gold-light);
      font-weight: 700;
    }

    .lang-fab-wrapper {
      position: relative;
      animation: floatBounce 3s ease-in-out infinite;
    }

    .lang-fab-wrapper:hover {
      animation-play-state: paused;
    }

    /* 버튼 뒤 펄스 링 */
    .lang-pulse-ring {
      position: absolute;
      inset: -4px;
      border-radius: 50%;
      border: 1.5px solid rgba(245, 158, 11, 0.6);
      animation: pulseWave 2.4s cubic-bezier(0.24, 0, 0.38, 1) infinite;
      pointer-events: none;
    }

    @keyframes pulseWave {
      0% { transform: scale(0.95); opacity: 0.85; }
      100% { transform: scale(1.55); opacity: 0; }
    }

    .lang-fab {
      position: relative;
      width: 60px;
      height: 60px;
      border-radius: 50%;
      background: linear-gradient(135deg, #1e293b, #090d16);
      border: 1.5px solid rgba(245, 158, 11, 0.65);
      color: var(--accent-gold-light);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.65), 0 0 22px rgba(245, 158, 11, 0.3);
      transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.3s ease;
    }

    .lang-fab:hover {
      transform: scale(1.14) rotate(18deg);
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.75), 0 0 32px rgba(245, 158, 11, 0.55);
    }

    @keyframes floatBounce {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-13px); }
    }

    /* Footer & Copyright */
    footer {
      position: relative;
      z-index: 10;
      width: 100%;
      border-top: 1px solid rgba(255, 255, 255, 0.07);
      padding: 28px 24px;
      text-align: center;
      color: var(--text-muted);
      font-size: 0.85rem;
      letter-spacing: 0.05em;
      background: rgba(6, 8, 13, 0.8);
      backdrop-filter: blur(10px);
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(26px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes slamDown {
      from { opacity: 0; transform: translateY(-22px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes scaleIn {
      from { opacity: 0; transform: scaleX(0); }
      to { opacity: 1; transform: scaleX(1); }
    }
  </style>
</head>

  <script>
    /* =========================================
       1. 전기 스파크 파티클 엔진 (Canvas)
    ========================================= */
    const canvas = document.getElementById('sparkCanvas');
    const ctx = canvas.getContext('2d');
    let sparks = [];

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    class Spark {
      constructor(x, y, burst = false) {
        this.x = x;
        this.y = y;
        const angle = Math.random() * Math.PI * 2;
        const speed = burst ? (Math.random() * 6 + 2) : (Math.random() * 1.6 + 0.4);
        this.vx = Math.cos(angle) * speed;
        this.vy = Math.sin(angle) * speed - (burst ? 1.5 : 0.8);
        this.gravity = burst ? 0.16 : -0.015;
        this.friction = 0.96;
        this.alpha = 1;
        this.decay = burst ? (Math.random() * 0.03 + 0.02) : (Math.random() * 0.012 + 0.006);
        this.size = burst ? (Math.random() * 2.4 + 1) : (Math.random() * 1.8 + 0.6);
        // 골드 & 일렉트릭 블루 스파크 컬러
        const colors = ['#fde68a', '#f59e0b', '#38bdf8', '#ffffff'];
        this.color = colors[Math.floor(Math.random() * colors.length)];
      }

      update() {
        this.vx *= this.friction;
        this.vy = this.vy * this.friction + this.gravity;
        this.x += this.vx;
        this.y += this.vy;
        this.alpha -= this.decay;
      }

      draw() {
        if (this.alpha <= 0) return;
        ctx.save();
        ctx.globalAlpha = this.alpha;
        ctx.strokeStyle = this.color;
        ctx.lineWidth = this.size;
        ctx.lineCap = 'round';
        ctx.shadowBlur = 10;
        ctx.shadowColor = this.color;

        // 불꽃 궤적 선 그리기
        ctx.beginPath();
        ctx.moveTo(this.x, this.y);
        ctx.lineTo(this.x - this.vx * 2.4, this.y - this.vy * 2.4);
        ctx.stroke();
        ctx.restore();
      }
    }

    // 배경에서 은은하게 피어오르는 스파크
    setInterval(() => {
      if (sparks.length < 90) {
        sparks.push(new Spark(Math.random() * canvas.width, canvas.height + 10, false));
      }
    }, 180);

    // 마우스 이동 시 미세한 스파크 꼬리
    let lastMove = 0;
    window.addEventListener('mousemove', (e) => {
      const now = Date.now();
      if (now - lastMove > 35) {
        sparks.push(new Spark(e.clientX, e.clientY, true));
        lastMove = now;
      }
    });

    // 클릭 시 스파크 폭발 액션
    window.addEventListener('click', (e) => {
      for (let i = 0; i < 22; i++) {
        sparks.push(new Spark(e.clientX, e.clientY, true));
      }
    });

    function animateSparks() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      for (let i = sparks.length - 1; i >= 0; i--) {
        sparks[i].update();
        sparks[i].draw();
        if (sparks[i].alpha <= 0) {
          sparks.splice(i, 1);
        }
      }
      requestAnimationFrame(animateSparks);
    }
    animateSparks();

    /* =========================================
       2. 3D 틸트 & 스포트라이트 카드 액션
    ========================================= */
    document.querySelectorAll('.tilt-card').forEach(card => {
      card.addEventListener('mousemove', (e) => {
        const rect = card.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;

        card.style.setProperty('--mouse-x', `${x}px`);
        card.style.setProperty('--mouse-y', `${y}px`);

        const centerX = rect.width / 2;
        const centerY = rect.height / 2;
        const rotateX = ((y - centerY) / centerY) * -9;
        const rotateY = ((x - centerX) / centerX) * 9;

        card.style.transform = `perspective(1000px) rotateX(${rotateX}deg) rotateY(${rotateY}deg) scale3d(1.03, 1.03, 1.03)`;
      });

      card.addEventListener('mouseleave', () => {
        card.style.transform = 'perspective(1000px) rotateX(0deg) rotateY(0deg) scale3d(1, 1, 1)';
      });
    });

    const langToggle = document.getElementById('langToggle');
    const langMenu = document.getElementById('langMenu');
    const langOptions = document.querySelectorAll('.lang-option');

    langToggle.addEventListener('click', (e) => {
      e.stopPropagation();
      langMenu.classList.toggle('active');
    });

    document.addEventListener('click', () => {
      langMenu.classList.remove('active');
    });

    function setLanguage(lang) {
      const dict = translations[lang];
      if (!dict) return;

      document.documentElement.lang = lang;
      document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';

      document.querySelectorAll('[data-i18n]').forEach(el => {
        const key = el.getAttribute('data-i18n');
        if (dict[key]) {
          el.style.opacity = '0';
          setTimeout(() => {
            el.textContent = dict[key];
            el.style.transition = 'opacity 0.25s ease';
            el.style.opacity = '1';
          }, 120);
        }
      });

      langOptions.forEach(btn => {
        btn.classList.toggle('selected', btn.dataset.lang === lang);
      });
    }

    langOptions.forEach(btn => {
      btn.addEventListener('click', () => {
        setLanguage(btn.dataset.lang);
        langMenu.classList.remove('active');
      });
    });
