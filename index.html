  <style>
    :root {
      --bg-primary: #090b10;
      --bg-secondary: #11151f;
      --card-bg: rgba(255, 255, 255, 0.03);
      --card-border: rgba(255, 255, 255, 0.08);
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --accent-gold: #d4af37;
      --accent-blue: #3b82f6;
      --accent-glow: rgba(59, 130, 246, 0.25);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: var(--bg-primary);
      color: var(--text-main);
      font-family: 'Plus Jakarta Sans', 'Noto Sans KR', 'Noto Sans JP', 'Noto Sans SC', 'Noto Sans Arabic', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
      position: relative;
    }

    /* 배경 오로라 & 클래식 그리드 애니메이션 */
    .bg-grid {
      position: fixed;
      inset: 0;
      background-image: 
        linear-gradient(to right, rgba(255, 255, 255, 0.025) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255, 255, 255, 0.025) 1px, transparent 1px);
      background-size: 48px 48px;
      z-index: -2;
      mask-image: radial-gradient(circle at center, black 40%, transparent 90%);
    }

    .ambient-orb {
      position: fixed;
      border-radius: 50%;
      filter: blur(110px);
      z-index: -1;
      opacity: 0.45;
      animation: orbDrift 14s ease-in-out infinite alternate;
    }

    .orb-1 {
      width: 420px;
      height: 420px;
      background: radial-gradient(circle, #2563eb, transparent 70%);
      top: -100px;
      left: -100px;
    }

    .orb-2 {
      width: 380px;
      height: 380px;
      background: radial-gradient(circle, #b45309, transparent 70%);
      bottom: -80px;
      right: -80px;
      animation-delay: -5s;
    }

    @keyframes orbDrift {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(45px, 35px) scale(1.15); }
    }

    /* 네비게이션 헤더 */
    header {
      width: 100%;
      max-width: 1100px;
      margin: 0 auto;
      padding: 28px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      animation: fadeDown 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .brand-logo {
      font-family: 'Cinzel', serif;
      font-size: 1.65rem;
      font-weight: 700;
      letter-spacing: 0.14em;
      color: var(--text-main);
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-badge {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 0.1em;
      padding: 3px 8px;
      border: 1px solid rgba(212, 175, 55, 0.4);
      color: var(--accent-gold);
      border-radius: 4px;
      text-transform: uppercase;
    }

    /* 메인 히어로 섹션 */
    main {
      flex: 1;
      width: 100%;
      max-width: 960px;
      margin: 0 auto;
      padding: 60px 24px 80px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .hero-eyebrow {
      font-size: 0.85rem;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: var(--accent-gold);
      margin-bottom: 18px;
      opacity: 0;
      animation: fadeUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.15s forwards;
    }

    .hero-title {
      font-family: 'Cinzel', 'Noto Sans KR', serif;
      font-size: clamp(2.8rem, 7vw, 4.8rem);
      font-weight: 700;
      letter-spacing: 0.08em;
      line-height: 1.15;
      margin-bottom: 22px;
      background: linear-gradient(135deg, #ffffff 30%, #a5b4fc 70%, #d4af37 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      opacity: 0;
      animation: fadeUp 0.9s cubic-bezier(0.16, 1, 0.3, 1) 0.3s forwards;
    }

    .hero-slogan {
      font-size: clamp(1.05rem, 2.5vw, 1.35rem);
      color: var(--text-muted);
      font-weight: 300;
      max-width: 620px;
      line-height: 1.7;
      margin-bottom: 52px;
      opacity: 0;
      animation: fadeUp 0.9s cubic-bezier(0.16, 1, 0.3, 1) 0.45s forwards;
    }

    /* 클래식 디바이더 */
    .classic-divider {
      width: 120px;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--accent-gold), transparent);
      margin: 0 auto 52px;
      opacity: 0;
      animation: scaleIn 0.8s ease 0.55s forwards;
    }

    /* 소셜 & 컨택트 카드 그리드 */
    .social-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 22px;
      width: 100%;
      opacity: 0;
      animation: fadeUp 0.9s cubic-bezier(0.16, 1, 0.3, 1) 0.65s forwards;
    }

    @media (max-width: 768px) {
      .social-grid {
        grid-template-columns: 1fr;
      }
    }

    .social-card {
      position: relative;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 32px 24px;
      text-decoration: none;
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      backdrop-filter: blur(12px);
      transition: transform 0.35s cubic-bezier(0.22, 1, 0.36, 1), 
                  border-color 0.35s ease, 
                  box-shadow 0.35s ease;
      overflow: hidden;
    }

    .social-card::before {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at top, rgba(255,255,255,0.08), transparent 70%);
      opacity: 0;
      transition: opacity 0.35s ease;
    }

    .social-card:hover {
      transform: translateY(-8px) scale(1.02);
      border-color: rgba(212, 175, 55, 0.45);
      box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.7), 0 0 25px rgba(212, 175, 55, 0.12);
    }

    .social-card:hover::before {
      opacity: 1;
    }

    .icon-wrapper {
      width: 60px;
      height: 60px;
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1), background 0.3s ease;
    }

    .social-card:hover .icon-wrapper {
      transform: scale(1.12) rotate(-4deg);
    }

    .card-youtube:hover .icon-wrapper { background: rgba(255, 0, 0, 0.15); border-color: rgba(255, 0, 0, 0.4); }
    .card-discord:hover .icon-wrapper { background: rgba(88, 101, 242, 0.15); border-color: rgba(88, 101, 242, 0.4); }
    .card-mail:hover .icon-wrapper { background: rgba(212, 175, 55, 0.15); border-color: rgba(212, 175, 55, 0.4); }

    .social-card svg {
      width: 28px;
      height: 28px;
      transition: transform 0.3s ease;
    }

    .card-title {
      font-size: 1.15rem;
      font-weight: 600;
      letter-spacing: 0.02em;
    }

    .card-desc {
      font-size: 0.88rem;
      color: var(--text-muted);
      line-height: 1.5;
    }

    /* 둥둥 뜨는 다국어 플로팅 버튼 및 메뉴 */
    .lang-floating-container {
      position: fixed;
      bottom: 30px;
      right: 30px;
      z-index: 1000;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
    }

    .lang-menu {
      background: rgba(17, 21, 31, 0.92);
      border: 1px solid rgba(212, 175, 55, 0.3);
      backdrop-filter: blur(16px);
      border-radius: 16px;
      padding: 8px;
      margin-bottom: 14px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      min-width: 155px;
      box-shadow: 0 20px 45px rgba(0, 0, 0, 0.65);
      opacity: 0;
      transform: translateY(15px) scale(0.92);
      pointer-events: none;
      transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
      transform-origin: bottom right;
    }

    .lang-menu.active {
      opacity: 1;
      transform: translateY(0) scale(1);
      pointer-events: auto;
    }

    .lang-option {
      background: transparent;
      border: none;
      color: var(--text-main);
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 0.9rem;
      text-align: left;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: background 0.2s ease, color 0.2s ease;
      font-family: inherit;
    }

    .lang-option:hover {
      background: rgba(255, 255, 255, 0.08);
    }

    .lang-option.selected {
      background: rgba(212, 175, 55, 0.16);
      color: var(--accent-gold);
      font-weight: 600;
    }

    .lang-fab {
      width: 58px;
      height: 58px;
      border-radius: 50%;
      background: linear-gradient(135deg, #1e293b, #0f172a);
      border: 1px solid rgba(212, 175, 55, 0.5);
      color: var(--accent-gold);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.5), 0 0 18px rgba(212, 175, 55, 0.2);
      /* 붕 뜨는 플로팅 애니메이션 */
      animation: floatBounce 3.2s ease-in-out infinite;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .lang-fab:hover {
      animation-play-state: paused;
      transform: scale(1.1);
      box-shadow: 0 14px 32px rgba(0, 0, 0, 0.6), 0 0 25px rgba(212, 175, 55, 0.4);
    }

    @keyframes floatBounce {
      0%, 100% {
        transform: translateY(0px);
      }
      50% {
        transform: translateY(-11px);
      }
    }

    /* Footer & Copyright */
    footer {
      width: 100%;
      border-top: 1px solid rgba(255, 255, 255, 0.06);
      padding: 28px 24px;
      text-align: center;
      color: var(--text-muted);
      font-size: 0.85rem;
      letter-spacing: 0.04em;
      background: rgba(9, 11, 16, 0.7);
      backdrop-filter: blur(8px);
    }

    /* 키프레임 모음 */
    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(24px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes fadeDown {
      from {
        opacity: 0;
        transform: translateY(-18px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes scaleIn {
      from {
        opacity: 0;
        transform: scaleX(0);
      }
      to {
        opacity: 1;
        transform: scaleX(1);
      }
    }
  </style>

        dc_desc: "Присоединяйтесь к сообществу для общения в реальном времени",
        mail_title: "Эл. почта",
        mail_desc: "Деловые запросы и предложения о сотрудничестве",
        copyright: "© 2026 LTE2E. Все права защищены."
      }
    };

    const langToggle = document.getElementById('langToggle');
    const langMenu = document.getElementById('langMenu');
    const langOptions = document.querySelectorAll('.lang-option');

    // 플로팅 버튼 클릭 시 메뉴 토글
    langToggle.addEventListener('click', (e) => {
      e.stopPropagation();
      langMenu.classList.toggle('active');
    });

    // 바깥 영역 클릭 시 메뉴 닫기
    document.addEventListener('click', () => {
      langMenu.classList.remove('active');
    });

    // 언어 변경 함수
    function setLanguage(lang) {
      const dict = translations[lang];
      if (!dict) return;

      document.documentElement.lang = lang;
      // 아랍어 선택 시 우측에서 좌측(RTL) 레이아웃 자동 전환
      document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';

      document.querySelectorAll('[data-i18n]').forEach(el => {
        const key = el.getAttribute('data-i18n');
        if (dict[key]) {
          el.style.opacity = '0';
          setTimeout(() => {
            el.textContent = dict[key];
            el.style.transition = 'opacity 0.25s ease';
            el.style.opacity = '1';
          }, 120);
        }
      });

      langOptions.forEach(btn => {
        btn.classList.toggle('selected', btn.dataset.lang === lang);
      });
    }

    langOptions.forEach(btn => {
      btn.addEventListener('click', () => {
        setLanguage(btn.dataset.lang);
        langMenu.classList.remove('active');
      });
    });
  </script>
</body>
</html>
